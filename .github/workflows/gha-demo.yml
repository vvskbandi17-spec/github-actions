name: Hello world
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Step
        run: echo "Running a build Step"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
     - name: Test Step
       run: echo "Running Test step"
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy Step
        run: echo "Running Deployment Step"
  
